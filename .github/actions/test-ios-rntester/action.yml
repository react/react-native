name: test-ios-rntester
description: Test iOS RNTester
inputs:
  run-unit-tests:
    description: whether unit tests should run or not.
    default: false
  flavor:
    description: The flavor of the build. Must be one of "Debug", "Release".
    default: Debug
  run-e2e-tests:
    description: Whether we want to run E2E tests or not
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Setup xcode
      uses: ./.github/actions/setup-xcode
    - name: Setup node.js
      uses: ./.github/actions/setup-node
    - name: Run yarn
      uses: ./.github/actions/yarn-install
    - name: Set Hermes prebuilt version
      shell: bash
      run: |
        node ./scripts/releases/use-hermes-prebuilt.js
    - name: Run yarn install again, with the correct hermes version
      uses: ./.github/actions/yarn-install
    - name: Prepare IOS Tests
      if: ${{ inputs.run-unit-tests == 'true' }}
      uses: ./.github/actions/prepare-ios-tests
    - name: Download the XCFrameworks built in this run
      uses: ./.github/actions/setup-spm-artifacts
      with:
        working-directory: packages/rn-tester
    # RNTester is a CocoaPods project in git, so developers can build React
    # Native from source. CI converts it to SwiftPM on every run.
    - name: Ensure CocoaPods (`spm add --deintegrate` shells out to `pod`)
      shell: bash
      run: pod --version || sudo gem install cocoapods --no-document
    # react-native-test-library ships only a podspec; scaffold writes its
    # Package.swift.
    - name: Scaffold Package.swift manifests for community dependencies
      shell: bash
      working-directory: packages/rn-tester
      run: npx react-native spm scaffold --artifacts /tmp/spm-artifacts --download skip || true
    - name: Convert RNTester to SwiftPM
      shell: bash
      working-directory: packages/rn-tester
      run: |
        # pod deintegrate fails on non-ASCII strings without a UTF-8 locale.
        LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 RN_STRICT_API=1 \
          npx react-native spm add --deintegrate --artifacts /tmp/spm-artifacts --download skip
    - name: Assert RNTester is on SwiftPM
      shell: bash
      working-directory: packages/rn-tester
      run: |
        if [[ ! -f RNTesterPods.xcodeproj/.spm-injected.json ]]; then
          echo "::error::spm add did not inject SwiftPM: RNTesterPods.xcodeproj/.spm-injected.json is missing"
          exit 1
        fi
        if [[ -f Podfile ]] && grep -q 'use_react_native!' Podfile; then
          echo "::error::spm add --deintegrate left use_react_native! in the Podfile"
          exit 1
        fi
        echo "SwiftPM injected in place; Podfile de-integrated."
    - name: Build RNTester
      shell: bash
      run: |
        xcodebuild \
          -scheme "RNTester" \
          -project packages/rn-tester/RNTesterPods.xcodeproj \
          -configuration "${{ inputs.flavor }}" \
          -sdk "iphonesimulator" \
          -destination "generic/platform=iOS Simulator" \
          -derivedDataPath "/tmp/RNTesterBuild"

        APP_PATH="/tmp/RNTesterBuild/Build/Products/${{ inputs.flavor }}-iphonesimulator/RNTester.app"
        echo "App found at $APP_PATH"
        echo "app-path=$APP_PATH" >> $GITHUB_ENV
    - name: Check the embedded React.framework flavor
      shell: bash
      run: |
        BINARY="${{ env.app-path }}/Frameworks/React.framework/React"
        if [[ ! -f "$BINARY" ]]; then
          echo "::error::No embedded React.framework binary at $BINARY"
          exit 1
        fi
        COUNT=$(nm "$BINARY" | grep -c getDebugProps || true)
        echo "getDebugProps symbols in $BINARY: $COUNT"
        if [[ "${{ inputs.flavor }}" == 'Debug' && "$COUNT" -eq 0 ]]; then
          echo "::error::Debug build embeds a Release React.framework (expected getDebugProps symbols, found none)"
          exit 1
        fi
        if [[ "${{ inputs.flavor }}" == 'Release' && "$COUNT" -ne 0 ]]; then
          echo "::error::Release build embeds a Debug React.framework ($COUNT getDebugProps symbols, expected none)"
          exit 1
        fi
    - name: 'Run Tests: iOS Unit and Integration Tests'
      if: ${{ inputs.run-unit-tests == 'true' }}
      shell: bash
      run: yarn test-ios

    - name: Zip Derived data folder
      if: ${{ inputs.run-unit-tests == 'true' }}
      shell: bash
      run: |
        echo "zipping tests results"
        cd /Users/runner/Library/Developer/Xcode
        tar -zcvf xcresults.tar.gz "/tmp/RNTesterTestResults"
    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      if: ${{ inputs.run-unit-tests == 'true' }}
      with:
        name: xcresults-${{ inputs.flavor }}
        path: /Users/runner/Library/Developer/Xcode/xcresults.tar.gz
    - name: Upload RNTester App
      uses: ./.github/actions/upload-artifact
      with:
        name: RNTesterApp-NewArch-${{ inputs.flavor }}
        path: ${{ env.app-path }}
    - name: Store test results
      if: ${{ inputs.run-unit-tests == 'true' }}
      uses: ./.github/actions/upload-artifact
      with:
        name: test-results-${{ inputs.flavor }}
        path: ./reports/junit
