name: test-ios-rntester
description: Test iOS RNTester
inputs:
  run-unit-tests:
    description: whether unit tests should run or not.
    default: false
  flavor:
    description: The flavor of the build. Must be one of "Debug", "Release".
    default: Debug
  run-e2e-tests:
    description: Whether we want to run E2E tests or not
    required: false
    default: false
  dependency-manager:
    description: 'How the app gets its native dependencies: swiftpm or cocoapods'
    default: swiftpm

runs:
  using: composite
  steps:
    - name: Setup xcode
      uses: ./.github/actions/setup-xcode
    - name: Setup node.js
      uses: ./.github/actions/setup-node
    - name: Run yarn
      uses: ./.github/actions/yarn-install
    - name: Set Hermes prebuilt version
      shell: bash
      run: |
        node ./scripts/releases/use-hermes-prebuilt.js
    - name: Run yarn install again, with the correct hermes version
      uses: ./.github/actions/yarn-install
    - name: Prepare IOS Tests
      if: ${{ inputs.run-unit-tests == 'true' }}
      uses: ./.github/actions/prepare-ios-tests
    - name: Setup ruby
      if: ${{ inputs.dependency-manager == 'cocoapods' }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6.10
        bundler: none
    - name: Install Bundler
      if: ${{ inputs.dependency-manager == 'cocoapods' }}
      shell: bash
      run: |
        BUNDLER_VERSION="$(awk '/BUNDLED WITH/{getline; print $1}' Gemfile.lock)"
        if [ -z "$BUNDLER_VERSION" ]; then
          echo "Could not determine Bundler version from Gemfile.lock." >&2
          exit 1
        fi
        for attempt in 1 2 3; do
          echo "Attempt $attempt of 3"
          if gem install bundler --version "$BUNDLER_VERSION" --no-document; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Attempt $attempt failed. Retrying..."
            sleep "$((attempt * 10))"
          fi
        done
        echo "All 3 attempts failed."
        exit 1
    - name: Download ReactNativeDependencies
      if: ${{ inputs.dependency-manager == 'cocoapods' }}
      uses: ./.github/actions/download-artifact
      with:
        name: ReactNativeDependencies${{ inputs.flavor }}.xcframework.tar.gz
        path: /tmp/third-party/
    - name: Download React Native Prebuilds
      if: ${{ inputs.dependency-manager == 'cocoapods' }}
      uses: ./.github/actions/download-artifact
      with:
        name: ReactCore${{ inputs.flavor }}.xcframework.tar.gz
        path: /tmp/ReactCore
    - name: Install CocoaPods dependencies
      if: ${{ inputs.dependency-manager == 'cocoapods' }}
      shell: bash
      run: |
        export RCT_USE_LOCAL_RN_DEP="/tmp/third-party/ReactNativeDependencies${{ inputs.flavor }}.xcframework.tar.gz"
        export RCT_TESTONLY_RNCORE_TARBALL_PATH="/tmp/ReactCore/ReactCore${{ inputs.flavor }}.xcframework.tar.gz"

        cd packages/rn-tester

        bundle install
        bundle exec pod update hermes-engine --no-repo-update
    - name: Download the XCFrameworks built in this run
      if: ${{ inputs.dependency-manager == 'swiftpm' }}
      uses: ./.github/actions/setup-spm-artifacts
      with:
        working-directory: packages/rn-tester
    # RNTester is a CocoaPods project in git, so developers can build React
    # Native from source. CI converts it to SwiftPM on every run.
    # react-native-test-library ships only a podspec; scaffold writes its
    # Package.swift.
    - name: Scaffold Package.swift manifests for community dependencies
      if: ${{ inputs.dependency-manager == 'swiftpm' }}
      shell: bash
      working-directory: packages/rn-tester
      run: npx react-native spm scaffold --artifacts /tmp/spm-artifacts --download skip || true
    - name: Convert RNTester to SwiftPM
      if: ${{ inputs.dependency-manager == 'swiftpm' }}
      shell: bash
      working-directory: packages/rn-tester
      run: RN_STRICT_API=1 npx react-native spm add --deintegrate --artifacts /tmp/spm-artifacts --download skip
    - name: Assert RNTester is on SwiftPM
      if: ${{ inputs.dependency-manager == 'swiftpm' }}
      shell: bash
      working-directory: packages/rn-tester
      run: |
        if [[ ! -f RNTesterPods.xcodeproj/.spm-injected.json ]]; then
          echo "::error::spm add did not inject SwiftPM: RNTesterPods.xcodeproj/.spm-injected.json is missing"
          exit 1
        fi
        if grep -q 'Pods-' RNTesterPods.xcodeproj/project.pbxproj; then
          echo "::error::spm add --deintegrate left CocoaPods references in RNTesterPods.xcodeproj"
          exit 1
        fi
        echo "SwiftPM injected in place; CocoaPods de-integrated."
    - name: Build RNTester
      shell: bash
      run: |
        if [[ "${{ inputs.dependency-manager }}" == "cocoapods" ]]; then
          container=(-workspace packages/rn-tester/RNTesterPods.xcworkspace)
        else
          container=(-project packages/rn-tester/RNTesterPods.xcodeproj)
        fi
        xcodebuild \
          -scheme "RNTester" \
          "${container[@]}" \
          -configuration "${{ inputs.flavor }}" \
          -sdk "iphonesimulator" \
          -destination "generic/platform=iOS Simulator" \
          -derivedDataPath "/tmp/RNTesterBuild"

        APP_PATH="/tmp/RNTesterBuild/Build/Products/${{ inputs.flavor }}-iphonesimulator/RNTester.app"
        echo "App found at $APP_PATH"
        echo "app-path=$APP_PATH" >> $GITHUB_ENV
    - name: Check the embedded React.framework flavor
      if: ${{ inputs.dependency-manager == 'swiftpm' }}
      shell: bash
      run: |
        BINARY="${{ env.app-path }}/Frameworks/React.framework/React"
        if [[ ! -f "$BINARY" ]]; then
          echo "::error::No embedded React.framework binary at $BINARY"
          exit 1
        fi
        COUNT=$(nm "$BINARY" | grep -c getDebugProps || true)
        echo "getDebugProps symbols in $BINARY: $COUNT"
        if [[ "${{ inputs.flavor }}" == 'Debug' && "$COUNT" -eq 0 ]]; then
          echo "::error::Debug build embeds a Release React.framework (expected getDebugProps symbols, found none)"
          exit 1
        fi
        if [[ "${{ inputs.flavor }}" == 'Release' && "$COUNT" -ne 0 ]]; then
          echo "::error::Release build embeds a Debug React.framework ($COUNT getDebugProps symbols, expected none)"
          exit 1
        fi
    - name: 'Run Tests: iOS Unit and Integration Tests'
      if: ${{ inputs.run-unit-tests == 'true' }}
      shell: bash
      run: yarn test-ios

    - name: Zip Derived data folder
      if: ${{ inputs.run-unit-tests == 'true' }}
      shell: bash
      run: |
        echo "zipping tests results"
        cd /Users/runner/Library/Developer/Xcode
        tar -zcvf xcresults.tar.gz "/tmp/RNTesterTestResults"
    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      if: ${{ inputs.run-unit-tests == 'true' && inputs.dependency-manager == 'swiftpm' }}
      with:
        name: xcresults-${{ inputs.flavor }}
        path: /Users/runner/Library/Developer/Xcode/xcresults.tar.gz
    - name: Upload RNTester App
      if: ${{ inputs.dependency-manager == 'swiftpm' }} # The e2e tests download this artifact; one upload per name
      uses: ./.github/actions/upload-artifact
      with:
        name: RNTesterApp-NewArch-${{ inputs.flavor }}
        path: ${{ env.app-path }}
    - name: Store test results
      if: ${{ inputs.run-unit-tests == 'true' && inputs.dependency-manager == 'swiftpm' }}
      uses: ./.github/actions/upload-artifact
      with:
        name: test-results-${{ inputs.flavor }}
        path: ./reports/junit
