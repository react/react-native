name: prepare-ios-tests
description: Prepare iOS Tests
runs:
  using: composite
  # The `Run Ruby Tests` step (`sh run_ruby_tests.sh`) was removed here. It had
  # never executed - no caller set `run-unit-tests: true` - and cannot pass as
  # written: run_ruby_tests.sh loads all ten *-test.rb into one process, where
  # test_utils/PodMock.rb's `Pod::UI` class collides with the real cocoapods
  # `Pod::UI` module that spm-test.rb requires. Reviving it is separate work.
  steps:
    - name: Boot iPhone Simulator
      shell: bash
      run: source scripts/.tests.env && xcrun simctl boot "$IOS_DEVICE" || true
    - name: 'Brew: Tap wix/brew'
      shell: bash
      run: brew tap wix/brew
    - name: brew install applesimutils watchman
      shell: bash
      run: brew install applesimutils watchman
    - name: Configure Watchman
      shell: bash
      run: echo "{}" > .watchmanconfig
