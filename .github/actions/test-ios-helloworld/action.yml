name: test-ios-helloworld
description: Test iOS Hello World
inputs:
  flavor:
    description: The flavor of the build. Must be one of "Debug", "Release".
    default: Debug
runs:
  using: composite
  steps:
    - name: Setup xcode
      uses: ./.github/actions/setup-xcode
    - name: Setup node.js
      uses: ./.github/actions/setup-node
    - name: Run yarn install
      uses: ./.github/actions/yarn-install
    - name: Set Hermes prebuilt version
      shell: bash
      run: |
        node ./scripts/releases/use-hermes-prebuilt.js
    - name: Run yarn install again, with the correct hermes version
      uses: ./.github/actions/yarn-install
    - name: Download the XCFrameworks built in this run
      uses: ./.github/actions/setup-spm-artifacts
      with:
        working-directory: private/helloworld/ios
    # RN_STRICT_API=1 keeps the C++ stable API enforced, as `yarn bootstrap ios` does.
    - name: Set up the Swift packages
      shell: bash
      working-directory: private/helloworld/ios
      run: RN_STRICT_API=1 npx react-native spm update --artifacts /tmp/spm-artifacts --download skip

    - name: Run Helloworld tests
      shell: bash
      run: |
        cd private/helloworld
        yarn test

    - name: Build HelloWorld project
      shell: bash
      run: |
        cd private/helloworld

        args=()
        if [[ ${{ inputs.flavor }} == "Release" ]]; then
          args+=(--prod)
        fi
        yarn build ios "${args[@]}" | cat
        yarn bundle ios "${args[@]}" | cat
