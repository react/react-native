name: Test ReactCommon C++
inputs:
  gradle-cache-encryption-key:
    description: 'The encryption key needed to store the Gradle Configuration cache'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y git cmake openssl libssl-dev clang
    - name: Setup git safe folders
      shell: bash
      run: git config --global --add safe.directory '*'
    - name: Setup node.js
      uses: ./.github/actions/setup-node
    - name: Install node dependencies
      uses: ./.github/actions/yarn-install
    - name: Setup gradle
      uses: ./.github/actions/setup-gradle
      with:
        cache-read-only: 'false'
        cache-encryption-key: ${{ inputs.gradle-cache-encryption-key }}
    # Shares the Fantom ccache key prefix: the tests link the libraries the
    # Fantom tester compiles, so its cache is a valid fallback.
    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: /github/home/.cache/ccache
        key: v2-ccache-fantom-${{ github.job }}-${{ github.ref }}-${{ hashFiles(
          'packages/react-native/ReactAndroid/**/*.cpp',
          'packages/react-native/ReactAndroid/**/*.h',
          'packages/react-native/ReactAndroid/**/CMakeLists.txt',
          'packages/react-native/ReactCommon/**/*.cpp',
          'packages/react-native/ReactCommon/**/*.h',
          'packages/react-native/ReactCommon/**/CMakeLists.txt',
          'private/react-native-fantom/tester/**/*.cpp',
          'private/react-native-fantom/tester/**/*.h',
          'private/react-native-fantom/tester/**/CMakeLists.txt'
          ) }}
        restore-keys: |
          v2-ccache-fantom-${{ github.job }}-${{ github.ref }}-
          v2-ccache-fantom-${{ github.job }}-
          v2-ccache-fantom-
    - name: Show ccache stats (before)
      shell: bash
      run: ccache -s -v
    - name: Run ReactCommon C++ tests
      shell: bash
      run: ./gradlew :private:react-native-fantom:testReactCommon
      env:
        CC: clang
        CXX: clang++
    - name: Upload test results
      if: ${{ always() }}
      uses: ./.github/actions/upload-artifact
      with:
        name: test-react-common-cxx-results
        compression-level: 1
        if-no-files-found: ignore
        path: private/react-native-fantom/build/reports
    - name: Save ccache
      if: ${{ github.ref == 'refs/heads/main' || contains(github.ref, '-stable') }}
      uses: actions/cache/save@v5
      with:
        path: /github/home/.cache/ccache
        key: v2-ccache-fantom-${{ github.job }}-${{ github.ref }}-${{ hashFiles(
          'packages/react-native/ReactAndroid/**/*.cpp',
          'packages/react-native/ReactAndroid/**/*.h',
          'packages/react-native/ReactAndroid/**/CMakeLists.txt',
          'packages/react-native/ReactCommon/**/*.cpp',
          'packages/react-native/ReactCommon/**/*.h',
          'packages/react-native/ReactCommon/**/CMakeLists.txt',
          'private/react-native-fantom/tester/**/*.cpp',
          'private/react-native-fantom/tester/**/*.h',
          'private/react-native-fantom/tester/**/CMakeLists.txt'
          ) }}
    - name: Show ccache stats (after)
      shell: bash
      run: ccache -s -v
