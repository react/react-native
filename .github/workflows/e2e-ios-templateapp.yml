name: E2E iOS Template App

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      fail-on-error:
        type: boolean
        default: false
    outputs:
      status:
        description: 'The result of the E2E tests (success or failure)'
        value: ${{ jobs.report.outputs.status }}

jobs:
  build:
    runs-on: macos-26-large
    outputs:
      failure-debug: ${{ steps.report-status.outputs.failure-debug }}
      failure-release: ${{ steps.report-status.outputs.failure-release }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      - name: Run yarn
        uses: ./.github/actions/yarn-install
      - name: Download React Native Package
        uses: ./.github/actions/download-artifact
        with:
          name: react-native-package
          path: /tmp/react-native-tmp
      - name: Print /tmp folder
        run: ls -lR /tmp/react-native-tmp
      - name: Configure git
        shell: bash
        run: |
          git config --global user.email "react-native-bot@meta.com"
          git config --global user.name "React Native Bot"
      - name: Create the app
        run: |
          REACT_NATIVE_PKG=$(find /tmp/react-native-tmp -type f -name "*.tgz")
          echo "React Native tgs is $REACT_NATIVE_PKG"

          # For stable branches, we want to use the stable branch of the template
          # In all the other cases, we want to use "main"
          BRANCH=${{ github.ref_name }}
          if ! [[ $BRANCH == *-stable* ]]; then
            BRANCH=main
          fi

          node ./scripts/e2e/init-project-e2e.js --projectName RNTestProject --currentBranch $BRANCH --directory /tmp/RNTestProject --pathToLocalReactNative $REACT_NATIVE_PKG
      - name: Download the XCFrameworks built in this run
        uses: ./.github/actions/setup-spm-artifacts
        with:
          working-directory: /tmp/RNTestProject/ios
      - name: Convert the app to SwiftPM
        working-directory: /tmp/RNTestProject/ios
        run: RN_STRICT_API=1 npx react-native spm add --deintegrate --artifacts /tmp/spm-artifacts --download skip
      - name: Build the app
        working-directory: /tmp/RNTestProject/ios
        run: |
          xcodebuild \
            -scheme "RNTestProject" \
            -project RNTestProject.xcodeproj \
            -configuration "${{ matrix.flavor }}" \
            -sdk "iphonesimulator" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "/tmp/RNTestProject"
      - name: Upload app
        uses: ./.github/actions/upload-artifact
        with:
          name: RNTestProject-${{ matrix.flavor }}
          overwrite: true
          path: /tmp/RNTestProject/Build/Products/${{ matrix.flavor }}-iphonesimulator/RNTestProject.app
      - name: Report status
        id: report-status
        if: always()
        uses: actions/github-script@v8
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          TEST_FLAVOR: ${{ matrix.flavor }}
        with:
          script: |
            const {recordJobFailure} = require('./.github/workflow-scripts/report-test-results');
            await recordJobFailure({github, context, core,
              steps: JSON.parse(process.env.STEP_RESULTS),
              flavor: process.env.TEST_FLAVOR,
              runnerName: process.env.RUNNER_NAME,
              jobStatus: process.env.JOB_STATUS,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT)});

  test:
    needs: build
    runs-on: macos-26-large
    outputs:
      status: ${{ steps.report-status.outputs.status }}
      failure-debug: ${{ steps.report-status.outputs.failure-debug }}
      failure-release: ${{ steps.report-status.outputs.failure-release }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      - name: Run yarn
        uses: ./.github/actions/yarn-install
      - name: Download app
        uses: ./.github/actions/download-artifact
        with:
          name: RNTestProject-${{ matrix.flavor }}
          path: /tmp/RNTestProjectBuild/RNTestProject.app
      - name: Check downloaded folder content
        run: ls -l /tmp/RNTestProjectBuild/RNTestProject.app
      - name: Download React Native Package
        if: ${{ matrix.flavor == 'Debug' }}
        uses: ./.github/actions/download-artifact
        with:
          name: react-native-package
          path: /tmp/react-native-tmp
      - name: Configure git
        if: ${{ matrix.flavor == 'Debug' }}
        shell: bash
        run: |
          git config --global user.email "react-native-bot@meta.com"
          git config --global user.name "React Native Bot"
      - name: Prepare project for Metro
        if: ${{ matrix.flavor == 'Debug' }}
        # In Debug the app loads its bundle from Metro, which must run from an
        # initialized project. Re-initialize it here (JS only — no pods); the
        # native app itself comes prebuilt from the `build` job.
        run: |
          REACT_NATIVE_PKG=$(find /tmp/react-native-tmp -type f -name "*.tgz")
          echo "React Native tgs is $REACT_NATIVE_PKG"

          BRANCH=${{ github.ref_name }}
          if ! [[ $BRANCH == *-stable* ]]; then
            BRANCH=main
          fi

          node ./scripts/e2e/init-project-e2e.js --projectName RNTestProject --currentBranch $BRANCH --directory /tmp/RNTestProject --pathToLocalReactNative $REACT_NATIVE_PKG
      - name: Run E2E Tests
        id: run-tests
        continue-on-error: true
        uses: ./.github/actions/maestro-ios
        with:
          app-path: '/tmp/RNTestProjectBuild/RNTestProject.app'
          app-id: org.reactjs.native.example.RNTestProject
          maestro-flow: ./scripts/e2e/.maestro/
          flavor: ${{ matrix.flavor }}
          working-directory: /tmp/RNTestProject
      - name: Report status
        id: report-status
        if: always()
        uses: actions/github-script@v8
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          TEST_FLAVOR: ${{ matrix.flavor }}
        with:
          script: |
            const {recordJobFailure} = require('./.github/workflow-scripts/report-test-results');
            await recordJobFailure({github, context, core,
              steps: JSON.parse(process.env.STEP_RESULTS),
              flavor: process.env.TEST_FLAVOR,
              runnerName: process.env.RUNNER_NAME,
              jobStatus: process.env.JOB_STATUS,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT)});

  report:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Report failed jobs
        id: check
        uses: actions/github-script@v8
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        with:
          script: |
            const {reportTestResults} = require('./.github/workflow-scripts/report-test-results');
            await reportTestResults({context, core,
              needs: JSON.parse(process.env.JOB_RESULTS),
              failOnError: process.env.FAIL_ON_ERROR === 'true',
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT)});
