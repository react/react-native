name: Test iOS SwiftPM - New App

permissions:
  contents: read

on:
  workflow_call:

jobs:
  test:
    runs-on: macos-15-large
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
    env:
      APP_IOS_DIR: private/helloworld/ios
      XCODE_PROJECT: HelloWorld.xcodeproj
      XCODE_SCHEME: HelloWorld
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup xcode
        uses: ./.github/actions/setup-xcode
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      - name: Run yarn install
        uses: ./.github/actions/yarn-install
      - name: Set Hermes prebuilt version
        shell: bash
        run: node ./scripts/releases/use-hermes-prebuilt.js
      - name: Run yarn install again, with the correct hermes version
        uses: ./.github/actions/yarn-install
      - name: Download React Native package
        uses: ./.github/actions/download-artifact
        with:
          name: react-native-package
          path: /tmp/react-native-tmp
      # Reinstalls private/helloworld in place against the packaged react-native
      # (published through the local proxy), so the app under test is what a user
      # would get from npm rather than the workspace source.
      - name: Prepare the HelloWorld application
        shell: bash
        run: node ./scripts/e2e/init-project-e2e.js --useHelloWorld --pathToLocalReactNative "/tmp/react-native-tmp/$(cat /tmp/react-native-tmp/react-native-package-version)"
      - name: Download the XCFrameworks built in this run
        uses: ./.github/actions/setup-spm-artifacts
        with:
          working-directory: ${{ env.APP_IOS_DIR }}
      # The `spm deinit` round trip runs in the Debug cell only: it does not
      # depend on the flavor.
      - name: Record HelloWorld before SwiftPM
        if: matrix.flavor == 'Debug'
        shell: bash
        run: |
          ./.github/workflow-scripts/assert-spm-deinit.sh record "$APP_IOS_DIR"
          cp -R "$APP_IOS_DIR" "$RUNNER_TEMP/ios-before-spm"
      # HelloWorld is a CocoaPods project in git. CI converts it to SwiftPM on every run.
      - name: Convert HelloWorld to SwiftPM
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: RN_STRICT_API=1 npx react-native spm add --deintegrate --artifacts /tmp/spm-artifacts --download skip
      - name: Assert HelloWorld is on SwiftPM
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: |
          if [[ ! -f "$XCODE_PROJECT/.spm-injected.json" ]]; then
            echo "::error::spm add did not inject SwiftPM: $XCODE_PROJECT/.spm-injected.json is missing"
            exit 1
          fi
          if grep -q 'Pods-' "$XCODE_PROJECT/project.pbxproj"; then
            echo "::error::spm add --deintegrate left CocoaPods references in $XCODE_PROJECT"
            exit 1
          fi
          echo "SwiftPM injected in place; CocoaPods de-integrated."
      - name: Build ${{ env.XCODE_SCHEME }} (${{ matrix.flavor }})
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "${{ matrix.flavor }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/spm-e2e-dd \
            build
      - name: Check the embedded React.framework flavor
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: |
          PRODUCTS="build/spm-e2e-dd/Build/Products/${{ matrix.flavor }}-iphonesimulator"
          if [[ ! -d "$PRODUCTS" ]]; then
            echo "Skipping flavor check: no build products directory."
            exit 0
          fi
          BINARY=$(find "$PRODUCTS" -maxdepth 4 -path '*.app/Frameworks/React.framework/React' -type f 2>/dev/null | head -1 || true)
          if [[ -z "$BINARY" ]] || ! command -v nm >/dev/null; then
            echo "Skipping flavor check: no embedded React.framework binary or no nm."
            exit 0
          fi
          COUNT=$(nm "$BINARY" | grep -c getDebugProps || true)
          echo "getDebugProps symbols in $BINARY: $COUNT"
          if [[ "${{ matrix.flavor }}" == 'Debug' && "$COUNT" -eq 0 ]]; then
            echo "::error::Debug build embeds a Release React.framework (expected getDebugProps symbols, found none)"
            exit 1
          fi
          if [[ "${{ matrix.flavor }}" == 'Release' && "$COUNT" -ne 0 ]]; then
            echo "::error::Release build embeds a Debug React.framework ($COUNT getDebugProps symbols, expected none)"
            exit 1
          fi
      - name: Take HelloWorld back to CocoaPods
        if: matrix.flavor == 'Debug'
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: npx react-native spm deinit
      # Informational only. Expected differences include the CocoaPods
      # references and the .xcworkspace, which `pod install` restores, and the
      # JavaScriptCore.framework reference and empty Pods group, which deinit
      # does not restore on purpose.
      - name: Show what changed since before SwiftPM
        if: ${{ !cancelled() && matrix.flavor == 'Debug' }}
        shell: bash
        run: diff -r -x build "$RUNNER_TEMP/ios-before-spm" "$APP_IOS_DIR" || true
      - name: Check that only the CocoaPods files are left
        if: matrix.flavor == 'Debug'
        shell: bash
        run: ./.github/workflow-scripts/assert-spm-deinit.sh check "$APP_IOS_DIR" "$XCODE_PROJECT" "$PODFILE_SHA256" "$GITIGNORE_SHA256"
      - name: Setup ruby
        if: matrix.flavor == 'Debug'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6.10
      # The tarballs are the Debug ones that setup-spm-artifacts downloaded.
      - name: Install the CocoaPods dependencies
        if: matrix.flavor == 'Debug'
        shell: bash
        working-directory: private/helloworld
        run: |
          export RCT_USE_LOCAL_RN_DEP=/tmp/deps-debug/ReactNativeDependenciesDebug.xcframework.tar.gz
          export RCT_TESTONLY_RNCORE_TARBALL_PATH=/tmp/rc-debug/ReactCoreDebug.xcframework.tar.gz
          yarn bootstrap ios | cat
      - name: Build ${{ env.XCODE_SCHEME }} with CocoaPods (Debug)
        if: matrix.flavor == 'Debug'
        shell: bash
        working-directory: ${{ env.APP_IOS_DIR }}
        run: |
          xcodebuild \
            -workspace "${XCODE_PROJECT%.xcodeproj}.xcworkspace" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/cocoapods-e2e-dd \
            build
