name: E2E iOS RNTester

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_call:
    inputs:
      fail-on-error:
        type: boolean
        default: false
      artifact-run-id:
        description: Run to take the app artifacts from; defaults to this run
        type: string
        default: ''
      flows-ref:
        description: Ref to take the Maestro flows from; defaults to the checked-out tree
        type: string
        default: ''
      argent-label:
        description: Label the calling workflow is registered under on Argent Cloud
        type: string
        required: true
    outputs:
      status:
        description: 'The result of the E2E tests (success or failure)'
        value: ${{ jobs.report.outputs.status }}

jobs:
  test:
    # A pull_request run has no id token to log into the remote simulators
    # with; the suite runs on request from e2e-ios-on-demand.yml instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.report-status.outputs.status }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Download App
        uses: ./.github/actions/download-artifact
        with:
          name: RNTesterApp-NewArch-${{ matrix.flavor }}
          path: /tmp/RNTesterBuild/RNTester.app
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Checkout the Maestro flows under test
        if: ${{ inputs.flows-ref != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.flows-ref }}
          path: .flows-under-test
          sparse-checkout: packages/rn-tester/.maestro
      - name: Use the Maestro flows under test
        if: ${{ inputs.flows-ref != '' }}
        run: |
          rm -rf packages/rn-tester/.maestro
          mv .flows-under-test/packages/rn-tester/.maestro packages/rn-tester/.maestro
      - name: Check downloaded folder content
        run: ls -lR /tmp/RNTesterBuild
      - name: Run E2E Tests
        id: run-tests
        continue-on-error: true
        uses: ./.github/actions/maestro-ios
        with:
          argent-label: ${{ inputs.argent-label }}
          app-path: '/tmp/RNTesterBuild/RNTester.app'
          app-id: com.meta.RNTester.localDevelopment
          maestro-flow: ./packages/rn-tester/.maestro/
          flavor: ${{ matrix.flavor }}
          device-model: iPhone-17-Pro
          device-os: iOS-26-2
      - name: Report status
        id: report-status
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: echo "status=failure" >> $GITHUB_OUTPUT

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - id: check
        # A skipped test job is not a failure: the tests do not run on a
        # pull_request run.
        run: |
          test="${{ needs.test.result }}"
          if [[ ("$test" != "success" && "$test" != "skipped") ||
                "${{ needs.test.outputs.status }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
      - name: Fail if needed
        if: ${{ inputs.fail-on-error && steps.check.outputs.status == 'failure' }}
        run: exit 1
