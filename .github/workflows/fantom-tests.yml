name: Fantom Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      fail-on-error:
        type: boolean
        default: false
    outputs:
      status:
        description: "'failure' if the Fantom tests failed, empty otherwise"
        value: ${{ jobs.test.outputs.status }}

jobs:
  test:
    runs-on: 8-core-ubuntu
    outputs:
      status: ${{ steps.report-status.outputs.status }}
    container:
      image: reactnativecommunity/react-native-android:latest
      env:
        TERM: 'dumb'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Fantom Tests
        id: run-tests
        if: ${{ !inputs.fail-on-error }}
        continue-on-error: true
        uses: ./.github/actions/run-fantom-tests
      - name: Run Fantom Tests
        # Same step without continue-on-error, so the final attempt fails
        # here. A step's continue-on-error expression doesn't see inputs.
        id: run-tests-final
        if: ${{ inputs.fail-on-error }}
        uses: ./.github/actions/run-fantom-tests
      - name: Report status
        id: report-status
        if: ${{ always() && (steps.run-tests.outcome == 'failure' || steps.run-tests-final.outcome == 'failure') }}
        run: echo "status=failure" >> $GITHUB_OUTPUT
