appId: ${APP_ID}
---
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/TextExample/wrap
- extendedWaitUntil:
    visible:
      id: 'text-wrap'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/text/wrap/default
    cropOn:
      id: 'text-wrap'
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/TextExample/nested
