appId: ${APP_ID}
---
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/ImageExample/static-image
- extendedWaitUntil:
    visible:
      id: 'image-static'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/image/static-image/default
    cropOn:
      id: 'image-static'
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: ../helpers/open-example.yml
          env:
            EXAMPLE_URL: rntester://example/ImageExample/base64-image
      - extendedWaitUntil:
          visible:
            id: 'image-base64'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot:
          path: ${VISUAL_OUTPUT_DIR}/image/base64/default
          cropOn:
            id: 'image-base64'
