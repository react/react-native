appId: ${APP_ID}
---
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/SwitchExample/basic
- extendedWaitUntil:
    visible:
      id: 'on-off-initial-off'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'on-off-initial-on'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/switch/basic/default
    cropOn:
      id: 'example-container'
- tapOn:
    id: 'on-off-initial-off'
- tapOn:
    id: 'on-off-initial-on'
- assertVisible:
    id: 'on-off-initial-off-indicator'
    text: 'On'
- assertVisible:
    id: 'on-off-initial-on-indicator'
    text: 'Off'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/switch/basic/toggled
    cropOn:
      id: 'example-container'
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/SwitchExample/disabled
- extendedWaitUntil:
    visible:
      id: 'example-container'
    timeout: 15000
- assertVisible:
    id: 'disabled-initial-off'
- assertVisible:
    id: 'disabled-initial-on'
- assertVisible:
    id: 'disabled-initial-off-indicator'
    text: 'Off'
- assertVisible:
    id: 'disabled-initial-on-indicator'
    text: 'On'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/switch/disabled/default
    cropOn:
      id: 'example-container'
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/SwitchExample/custom-colors
- extendedWaitUntil:
    visible:
      id: 'initial-false-switch'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'initial-true-switch'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/switch/custom-colors/default
    cropOn:
      id: 'example-container'
- tapOn:
    id: 'initial-false-switch'
- tapOn:
    id: 'initial-true-switch'
- assertVisible:
    id: 'initial-false-switch'
    checked: true
- assertVisible:
    id: 'initial-true-switch'
    checked: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/switch/custom-colors/toggled
    cropOn:
      id: 'example-container'
