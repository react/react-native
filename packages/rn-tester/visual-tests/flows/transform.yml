appId: ${APP_ID}
---
- runFlow:
    file: ../helpers/open-example.yml
    env:
      EXAMPLE_URL: rntester://example/TransformExample/rotate
- extendedWaitUntil:
    visible:
      id: 'transform-rotate'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: ${VISUAL_OUTPUT_DIR}/transform/rotate/default
    cropOn:
      id: 'transform-rotate'
- runFlow:
