appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Components'
    timeout: 30000
- openLink: ${EXAMPLE_URL}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Open'
          optional: true
