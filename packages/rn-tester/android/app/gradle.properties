org.gradle.parallel=true
# This is causing issue with dependencies task: https://github.com/gradle/gradle/issues/9645#issuecomment-530746758
# org.gradle.configureondemand=true
android.useAndroidX=true

# RN-Tester is building with NewArch always enabled
newArchEnabled=true
# RN-Tester is running with Hermes always enabled
hermesEnabled=true
# RN-Tester is running with EdgeToEdge always enabled
edgeToEdgeEnabled=true
# RN-Tester is building with the C++ stable API enforced
strictCxxApiEnabled=true
