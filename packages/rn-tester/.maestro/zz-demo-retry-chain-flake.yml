# DO NOT LAND. Fails on purpose in the first Android Release E2E attempt only,
# to show that a failure that passes on retry keeps CI green.
# - android-release-only: the Debug job excludes it.
# - local-screenshot-baseline: keeps it out of the Maestro Cloud runs.
# - The platform condition makes it a no-op in the iOS E2E job.
# - On retries, e2e-android-rntester.yml deletes the line marked
#   DEMO_FIRST_ATTEMPT_ONLY, so the flow runs and passes.
appId: ${APP_ID}
tags:
  - android-release-only
  - local-screenshot-baseline
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: 'Components'
          timeout: 30000
      - assertVisible: 'Deliberate first-attempt failure' # DEMO_FIRST_ATTEMPT_ONLY
