appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- stopApp
- openLink: rntester://example/LegacyModule/SampleLegacyModule
- runFlow: ./helpers/confirm-open-link.yml
- extendedWaitUntil:
    visible:
      id: 'run-all-tests'
    timeout: 120000
- tapOn:
    id: 'run-all-tests'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: 'voidFunc-result'
      - assertVisible:
          id: 'getBool-result'
          text: 'true'
      - assertVisible:
          id: 'getEnum-result'
          text: '1'
      - scrollUntilVisible:
          element:
            id: 'getNumber-result'
          direction: DOWN
          speed: 40
      - assertVisible:
          id: 'getNumber-result'
          text: '99.95'
      - scrollUntilVisible:
          element:
            id: 'getFloat-result'
          direction: DOWN
          speed: 40
      - assertVisible:
          id: 'getFloat-result'
          text: '99.94999694824219'
      - scrollUntilVisible:
          element:
            id: 'getInt-result'
          direction: DOWN
          speed: 40
      - assertVisible:
          id: 'getInt-result'
          text: '99'
      - scrollUntilVisible:
          element:
            id: 'getLongLong-result'
          direction: DOWN
          speed: 40
