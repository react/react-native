appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- launchApp
- stopApp
- openLink: rntester://example/SectionList/onEndReached
- runFlow: ./helpers/confirm-open-link.yml
- extendedWaitUntil:
    visible:
      id: 'start_test'
    timeout: 120000
- tapOn:
    id: 'start_test'
- assertVisible:
    id: 'output'
    text: 'onEndReached'
- openLink: rntester://example/SectionList/onViewableItemsChanged-horizontal-noWaitForInteraction
- runFlow: ./helpers/confirm-open-link.yml
- extendedWaitUntil:
    visible:
      id: 'section-list-viewability-horizontal-no-wait'
    timeout: 30000
- assertVisible:
    id: 'output'
    text: '.*Pizza.*'
- openLink: rntester://example/SectionList/onViewableItemsChanged-horizontal-waitForInteraction
- runFlow: ./helpers/confirm-open-link.yml
- extendedWaitUntil:
    visible:
      id: 'section-list-viewability-horizontal-wait'
    timeout: 30000
# Tap twice: the first scroll uses estimated layout and measures Cheesecake,
# the second centers it exactly now that its metrics are known.
- tapOn:
    id: 'start_test'
- extendedWaitUntil:
    visible:
      id: 'Cheesecake'
    timeout: 30000
- tapOn:
    id: 'start_test'
- extendedWaitUntil:
    visible:
      id: 'output'
      text: '.*Cheesecake.*'
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: rntester://example/SectionList/onViewableItemsChanged-waitForInteraction
      - runFlow: ./helpers/confirm-open-link.yml
      - extendedWaitUntil:
          visible:
            id: 'section-list-viewability-vertical-wait'
          timeout: 30000
      # Same two-tap deterministic scroll as the horizontal step above.
      - tapOn:
          id: 'start_test'
      - extendedWaitUntil:
          visible:
            id: 'Cheesecake'
          timeout: 30000
      - tapOn:
          id: 'start_test'
      - extendedWaitUntil:
          visible:
            id: 'output'
            text: '.*Cheesecake.*'
          timeout: 30000
