appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- launchApp
- extendedWaitUntil:
    visible: 'Components'
    timeout: 30000
- openLink: rntester://example/TurboModuleExample
- extendedWaitUntil:
    visible: 'getStringRoundTrip'
    timeout: 30000
- tapOn: 'getStringRoundTrip'
# 200 rounds x (17 fixed + 2 random) strings: ASCII, Latin-1, CJK, RTL, emoji, ZWJ, combining marks,
# 255/256/257 stack-buffer boundary, 5000 and 100000 chars, random) + null.
- extendedWaitUntil:
    visible: '.*3800/3800 ok.*'
    timeout: 180000
- assertNotVisible: '.*FAIL.*'
