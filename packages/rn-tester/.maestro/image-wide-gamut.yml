appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
tags:
  - android-only
  # The screenshot baseline is captured on the local CI emulator and is
  # intentionally not portable across Maestro Cloud device profiles.
  - local-screenshot-baseline
---
# Android-only: alpha transparency + sRGB vs Display-P3 wide-gamut. Color
# fidelity is covered by a screenshot captured from the ARM64 APK on the API 35
# sRGB emulator. The flow is guarded because it is flaky on the iOS E2E job.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ./helpers/launch-app-and-search.yml
      - inputText:
          text: 'Image'
      - assertVisible:
          id: 'Image'
      - tapOn:
          id: 'Image'
      - assertVisible:
          id: 'example_search'
      - tapOn:
          id: 'example_search'
      - inputText: 'Wide Gamut'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'image-wide-gamut'
          direction: DOWN
          speed: 40
          timeout: 10000
      - extendedWaitUntil:
          visible: 'alpha: loaded'
          timeout: 15000
      - scrollUntilVisible:
          element: 'sRGB: loaded'
          direction: DOWN
          speed: 40
          timeout: 20000
      - scrollUntilVisible:
          element: 'P3: loaded'
          direction: DOWN
          speed: 40
          timeout: 20000
      # Change this to takeScreenshot when you want to update the screenshot
      - assertScreenshot:
          path: screenshots/image-wide-gamut-${maestro.platform}
          cropOn:
            id: 'image-wide-gamut'
          thresholdPercentage: 95
